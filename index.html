<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Soda | Pure Zero Refreshment</title>
    <meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bubbles -->
    <div id="bubbles-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Soda</span>
        </div>
        <nav class="nav glass">
            <a href="#" class="nav-item active">Home</a>
            <a href="#" class="nav-item">Ingredients</a>
            <a href="#" class="nav-item">Taste</a>
            <a href="#" class="nav-item">Eco</a>
            <a href="#" class="nav-item">Reviews</a>
        </nav>
        <button class="contact-btn">Contact Us</button>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <div class="hero-content">
            
            <!-- Leaves (Background Parallax) -->
            <div class="leaves-container">
                <model-viewer class="leaf l1" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 75deg 105%"></model-viewer>
                <model-viewer class="leaf l2" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-30deg 60deg 105%"></model-viewer>
                <model-viewer class="leaf l3" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="120deg 85deg 105%"></model-viewer>
                <model-viewer class="leaf l4" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="10deg 45deg 105%"></model-viewer>
            </div>

            <!-- Left Column -->
            <div class="hero-left">
                <h1 class="main-title">
                    <span class="outline">Pure</span><br>
                    Zero
                </h1>
                <p class="description">
                    Unleash the crisp taste of zero sugar. <br>
                    Refreshment redefined in every bubble — <br>
                    all in one sleek design.
                </p>
                <div class="cta-group">
                    <button class="primary-btn">
                        Shop Now
                        <span class="plus-icon">+</span>
                    </button>
                </div>
                <div class="award-badge">
                    <div class="award-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">DESIGN AWARDS</span>
                        <span class="award-subtitle">PREMIUM BEVERAGE 2025</span>
                    </div>
                </div>
            </div>

            <!-- Background Berries -->
            <div class="berries-container-bg">
                <model-viewer class="berry b7" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-20deg 110deg 105%"></model-viewer>
                <model-viewer class="berry b8" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="160deg 45deg 105%"></model-viewer>
                <model-viewer class="berry b9" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 20deg 105%"></model-viewer>
            </div>

            <!-- Center Product (3D Can) -->
            <div class="hero-center">
                <model-viewer id="product-model" src="https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb" alt="Diet Soda 3D Model" camera-controls
                    disable-zoom shadow-intensity="0" environment-image="neutral" exposure="1.5"
                    interaction-prompt="none" camera-orbit="0deg 90deg 380%" field-of-view="30deg"
                    class="main-product-3d">
                </model-viewer>
            </div>

            <!-- Foreground Berries -->
            <div class="berries-container">
                <model-viewer class="berry b1" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="45deg 120deg 105%"></model-viewer>
                <model-viewer class="berry b2" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-120deg 45deg 105%"></model-viewer>
                <model-viewer class="berry b3" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="200deg 90deg 105%"></model-viewer>
                <model-viewer class="berry b4" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="10deg 20deg 105%"></model-viewer>
                <model-viewer class="berry b5" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-45deg 160deg 105%"></model-viewer>
                <model-viewer class="berry b6" src="https://modelviewer.dev/shared-assets/models/Lemon.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="80deg 75deg 105%"></model-viewer>
            </div>

            <!-- Right Column -->
            <div class="hero-right">
                <div class="product-carousel">
                    <div class="carousel-cards">
                        <div class="card active" data-flavor="classic">
                            <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200&auto=format&fit=crop&q=80" alt="Diet Classic">
                            <div class="card-info">
                                <span>Diet Classic</span>
                                <span>$2.99</span>
                            </div>
                        </div>
                        <div class="card" data-flavor="blue">
                            <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=200&auto=format&fit=crop&q=80" alt="Zero Lime" style="filter: brightness(0.7);">
                            <div class="card-info">
                                <span>Zero Lime</span>
                                <span>$2.99</span>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-nav">
                        <button class="nav-arrow" id="prev-btn">←</button>
                        <button class="nav-arrow" id="next-btn">→</button>
                    </div>
                </div>
                <h2 class="side-title">
                    <span class="outline">Refreshingly</span><br>
                    Clean
                </h2>
            </div>

        </div>
    </main>

    <!-- Script file -->
    <script src="script.js"></script>
</body>
</html>
